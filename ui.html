<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h2 { font-size: 15px; font-weight: 600; }
    .desc { color: #666; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 8px 0;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #18a0fb; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
    .status.info    { background: #e8f4fd; color: #0d6ebd; display: block; }
    .status.error   { background: #fde8e8; color: #c0392b; display: block; }
    .status.success { background: #e8fdf0; color: #1a7a3f; display: block; }
    .divider { border: none; border-top: 1px solid #eee; }

    /* MCP 服务状态指示器 */
    .agent-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #999;
      padding: 4px 0;
    }
    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .agent-dot.connected { background: #2ecc71; }
    .agent-dot.disconnected { background: #e74c3c; }
    .mcp-actions {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .btn-mcp {
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      color: #666;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-mcp:hover { background: #e8e8e8; }
    .btn-mcp:disabled { opacity: 0.45; cursor: default; }
  </style>
  <!-- JSZip：打包 zip 用 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <h2>JSON Exporter</h2>
  <p class="desc">v3.4.1 · 修复裁剪节点的空视觉边界；保留渐变校验、AUTO 行高、文字颜色和图片外扩边界。</p>

  <!-- MCP 服务状态 -->
  <div class="agent-bar" id="agentBar">
    <span class="agent-dot disconnected" id="agentDot"></span>
    <span id="agentLabel">MCP 未启动</span>
    <span class="mcp-actions">
      <button class="btn-mcp" id="startMcpBtn">启动</button>
      <button class="btn-mcp" id="stopMcpBtn" disabled>关闭</button>
    </span>
  </div>

  <hr class="divider" />

  <div class="options">
    <label><input type="checkbox" id="shapeGroupsAsImages" checked />组合形状整体导出为图片</label>
    <label>
      <input type="checkbox" id="includeImages" checked />
      包含图片资源（导出为 ZIP，图片单独存放）
    </label>
    <label>
      <input type="checkbox" id="prettyPrint" checked />
      格式化输出（Pretty Print）
    </label>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="exportBtn">导出</button>
    <button class="btn-secondary" id="cancelBtn">取消</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    var imageBytesMap = {};
    var MCP_WS_URL = "ws://localhost:3456/ws";
    var MCP_HTTP_URL = "http://localhost:3456";
    var ws = null;
    var wsReconnectTimer = null;
    var remoteRequestId = null;
    var remoteShapeGroupsAsImages = true;
    var mcpReconnectEnabled = true;

    function setMcpStatus(connected) {
      var dot = document.getElementById("agentDot");
      var label = document.getElementById("agentLabel");
      dot.className = "agent-dot " + (connected ? "connected" : "disconnected");
      label.textContent = connected ? "MCP 已启动" : "MCP 未启动";
      document.getElementById("startMcpBtn").disabled = connected;
      document.getElementById("stopMcpBtn").disabled = !connected;
    }

    function handleWsMessage(event) {
      var msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      if (msg.type === "ping") {
        ws.send(JSON.stringify({ type: "pong" }));
      } else if (msg.type === "export") {
        remoteRequestId = msg.requestId || null;
        remoteShapeGroupsAsImages = msg.shapeGroupsAsImages !== false;
        startExportInternal();
      }
    }

    function bindWsHandlers(c) {
      c.onopen = function() {
        setMcpStatus(true);
        setStatus("MCP 已启动，可以由 Agent 调用当前 Figma 选区。", "success");
      };
      c.onmessage = handleWsMessage;
      c.onclose = function() {
        setMcpStatus(false);
        remoteRequestId = null;
        if (mcpReconnectEnabled) scheduleReconnect();
      };
      c.onerror = function() {};
    }

    function connectMcp() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
      try {
        ws = new WebSocket(MCP_WS_URL);
        bindWsHandlers(ws);
        setTimeout(function() {
          if (!ws || ws.readyState !== WebSocket.OPEN) {
            setStatus("本机 MCP 服务尚未运行；从 Agent 访问 MCP 后，JS 入口会自动启动服务。", "info");
          }
        }, 1200);
      } catch (e) {
        setMcpStatus(false);
        scheduleReconnect();
      }
    }

    function scheduleReconnect() {
      if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
      wsReconnectTimer = setTimeout(connectMcp, 3000);
    }

    function startMcp() {
      mcpReconnectEnabled = true;
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      if (ws) {
        ws.onclose = null;
        ws.onerror = null;
        ws.close();
        ws = null;
      }
      document.getElementById("agentLabel").textContent = "MCP 启动检测中...";
      document.getElementById("agentDot").className = "agent-dot disconnected";
      try {
        ws = new WebSocket(MCP_WS_URL);
        bindWsHandlers(ws);
      } catch (e) {
        setMcpStatus(false);
        scheduleReconnect();
      }
    }

    function stopMcp() {
      mcpReconnectEnabled = false;
      if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
      document.getElementById("agentLabel").textContent = "MCP 关闭中...";
      fetch(MCP_HTTP_URL + "/control/shutdown", { method: "POST" })
        .catch(function() {})
        .then(function() {
          if (ws) {
            ws.onclose = null;
            ws.onerror = null;
            ws.close();
            ws = null;
          }
          setMcpStatus(false);
          setStatus("MCP 已关闭；下次 Agent 访问 MCP 时会自动重新启动。", "info");
        });
    }

    function sendToMcp(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    }

    function setStatus(msg, type) {
      var el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status " + (type || "info");
    }

    function startExport() {
      remoteRequestId = null;
      startExportInternal();
    }

    function startExportInternal() {
      imageBytesMap = {};
      document.getElementById("exportBtn").disabled = true;
      setStatus("正在导出，请稍候...", "info");
      parent.postMessage({
        pluginMessage: {
          type: "export",
          requestId: remoteRequestId,
          shapeGroupsAsImages: remoteRequestId ? remoteShapeGroupsAsImages : document.getElementById("shapeGroupsAsImages").checked
        }
      }, "*");
    }

    function cancel() {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    }

    function cleanHashes(n) {
      delete n._imageHashes;
      if (n.children) n.children.forEach(cleanHashes);
    }

    function downloadJSON(data) {
      var pretty = document.getElementById("prettyPrint").checked;
      data.nodes.forEach(cleanHashes);
      delete data.images;

      var json = pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = (data.meta && data.meta.nodeName || data.meta && data.meta.pageName || "figma-export") +
        "-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadZip(data, imageBytesMap) {
      var pretty = document.getElementById("prettyPrint").checked;
      var baseName = (data.meta && data.meta.nodeName || data.meta && data.meta.pageName || "figma-export") +
        "-" + new Date().toISOString().slice(0, 10);

      var zip = new JSZip();
      var imgFolder = zip.folder("images");
      var images = {};
      for (var hash in imageBytesMap) {
        if (!imageBytesMap.hasOwnProperty(hash)) continue;
        var bytes = imageBytesMap[hash];
        var ext = bytes[0] === 255 ? "jpg" : bytes[0] === 71 ? "gif" : bytes[0] === 82 ? "webp" : "png";
        var fileName = hash.replace(/[^a-zA-Z0-9_-]/g, "_") + "." + ext;
        imgFolder.file(fileName, new Uint8Array(imageBytesMap[hash]));
        images[hash] = "images/" + fileName;
        if (data.assets && data.assets[hash]) data.assets[hash].relativePath = images[hash];
      }

      data.nodes.forEach(cleanHashes);
      data.images = images;
      var json = pretty ? JSON.stringify(data, null, 2) : JSON.stringify(data);
      zip.file("index.json", json);

      return zip.generateAsync({ type: "blob" }).then(function(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = baseName + ".zip";
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;
      // Late replies from a cancelled/expired MCP request must not affect the next export.
      if (msg.requestId && msg.requestId !== remoteRequestId) return;

      if (msg.type === "progress") {
        setStatus(msg.message, "info");
        if (remoteRequestId) sendToMcp({ type: "progress", requestId: remoteRequestId, message: msg.message });
      }

      if (msg.type === "image") {
        imageBytesMap[msg.hash] = msg.bytes;
        setStatus("已接收图片资源 " + Object.keys(imageBytesMap).length + " 张...", "info");
        if (remoteRequestId) {
          sendToMcp({ type: "image", requestId: remoteRequestId, hash: msg.hash, bytes: msg.bytes });
        }
      }

      if (msg.type === "error") {
        setStatus(msg.message, "error");
        document.getElementById("exportBtn").disabled = false;
        if (remoteRequestId) {
          sendToMcp({ type: "error", requestId: remoteRequestId, message: msg.message });
          remoteRequestId = null;
        }
      }

      if (msg.type === "done") {
        var data = msg.data;
        var imageCount = msg.imageCount || Object.keys(imageBytesMap).length;
        var includeImages = document.getElementById("includeImages").checked;
        var nodeCount = (data.meta && data.meta.nodeCount) || 0;

        if (remoteRequestId) {
          data.nodes.forEach(cleanHashes);
          delete data._imageHashes;
          sendToMcp({
            type: "done",
            requestId: remoteRequestId,
            data: data,
            imageCount: imageCount
          });
          setStatus("已通过 MCP 返回（" + nodeCount + " 个节点" + (imageCount > 0 ? "，" + imageCount + " 张图片" : "") + "）", "success");
          document.getElementById("exportBtn").disabled = false;
          remoteRequestId = null;
          return;
        }

        if (includeImages && imageCount > 0) {
          setStatus("正在打包 " + imageCount + " 张图片...", "info");
          downloadZip(data, imageBytesMap).then(function() {
            setStatus("导出成功！" + nodeCount + " 个节点，" + imageCount + " 张图片 → ZIP", "success");
            document.getElementById("exportBtn").disabled = false;
          }).catch(function(e) {
            setStatus("ZIP 打包失败：" + e.message, "error");
            document.getElementById("exportBtn").disabled = false;
          });
        } else {
          downloadJSON(data);
          setStatus("导出成功！" + nodeCount + " 个节点" + (imageCount === 0 ? "，无图片" : ""), "success");
          document.getElementById("exportBtn").disabled = false;
        }
      }
    };

    document.getElementById("startMcpBtn").addEventListener("click", startMcp);
    document.getElementById("stopMcpBtn").addEventListener("click", stopMcp);
    document.getElementById("exportBtn").addEventListener("click", startExport);
    document.getElementById("cancelBtn").addEventListener("click", cancel);
    connectMcp();
  </script>
</body>
</html>
