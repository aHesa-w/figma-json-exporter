<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h2 { font-size: 15px; font-weight: 600; }
    .desc { color: #666; line-height: 1.5; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    button {
      flex: 1;
      padding: 8px 0;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #18a0fb; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .status {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      display: none;
    }
    .status.info { background: #e8f4fd; color: #0d6ebd; display: block; }
    .status.error { background: #fde8e8; color: #c0392b; display: block; }
    .status.success { background: #e8fdf0; color: #1a7a3f; display: block; }
    .divider { border: none; border-top: 1px solid #eee; }
  </style>
</head>
<body>
  <h2>JSON Exporter</h2>
  <p class="desc">导出选中节点的完整结构数据，包含样式、约束、Auto Layout 和图片资源。</p>

  <hr class="divider" />

  <div class="options">
    <label>
      <input type="checkbox" id="includeImages" checked />
      包含图片资源（Base64 内嵌）
    </label>
    <label>
      <input type="checkbox" id="prettyPrint" checked />
      格式化输出（Pretty Print）
    </label>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="exportBtn" onclick="startExport()">导出 JSON</button>
    <button class="btn-secondary" onclick="cancel()">取消</button>
  </div>

  <div class="status" id="status"></div>

  <script>
    function setStatus(msg, type = "info") {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status " + type;
    }

    function startExport() {
      document.getElementById("exportBtn").disabled = true;
      setStatus("正在导出，请稍候...", "info");
      parent.postMessage({ pluginMessage: { type: "export" } }, "*");
    }

    function cancel() {
      parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
    }

    function downloadJSON(data) {
      const pretty = document.getElementById("prettyPrint").checked;
      const includeImages = document.getElementById("includeImages").checked;

      if (!includeImages) {
        delete data.images;
        // 清理节点内的 _imageHashes
        function cleanHashes(n) {
          delete n._imageHashes;
          if (n.children) n.children.forEach(cleanHashes);
        }
        data.nodes.forEach(cleanHashes);
      }

      const json = pretty
        ? JSON.stringify(data, null, 2)
        : JSON.stringify(data);

      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const fileName = (data.meta?.pageName || "figma-export") + "-" +
        new Date().toISOString().slice(0, 10) + ".json";
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "progress") {
        setStatus(msg.message, "info");
      }

      if (msg.type === "error") {
        setStatus(msg.message, "error");
        document.getElementById("exportBtn").disabled = false;
      }

      if (msg.type === "done") {
        const nodeCount = msg.data.meta?.nodeCount || 0;
        const imgCount = Object.keys(msg.data.images || {}).length;
        downloadJSON(msg.data);
        setStatus(
          `✅ 导出成功！${nodeCount} 个节点，${imgCount} 张图片`,
          "success"
        );
        document.getElementById("exportBtn").disabled = false;
      }
    };
  </script>
</body>
</html>
